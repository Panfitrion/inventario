<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Logistics Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 h-screen w-screen overflow-hidden flex flex-col">

    <!-- ERROR TRAP (Hidden unless crash) -->
    <div id="error-trap" class="hidden fixed inset-0 bg-red-100 p-4 z-[9999] overflow-auto text-red-800 font-mono text-xs"></div>

    <!-- HEADER -->
    <header class="bg-slate-900 text-white shadow-md z-30 shrink-0 safe-pt">
        <div class="px-4 py-3 flex justify-between items-center h-16">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-blue-700 rounded-lg flex items-center justify-center shadow-inner">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                </div>
                <div>
                    <h1 class="text-base font-bold leading-none tracking-wide">LOGISTICS <span class="text-blue-400">PRO</span></h1>
                    <p id="header-subtitle" class="text-[10px] text-slate-400 font-medium uppercase tracking-wider mt-0.5">Panel de Control</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div id="header-clock" class="text-right hidden sm:block">
                    <div id="live-time" class="text-lg font-mono font-bold tracking-tight leading-none">00:00</div>
                </div>
                <button onclick="app.toggleConfig()" id="btn-config" class="p-2 text-slate-400 hover:text-white transition-colors rounded-full hover:bg-slate-800">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main id="app-container" class="flex-1 overflow-y-auto hide-scrollbar relative bg-slate-100 pb-24">
        
        <!-- DASHBOARD VIEW -->
        <div id="view-dashboard" class="p-4 space-y-6 animate-fade-in">
            <!-- Summary Stats -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Rutas Completadas</p>
                    <p id="stat-routes" class="text-3xl font-extrabold text-slate-800 mt-1">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Estado</p>
                    <div class="mt-2 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        <span class="text-xs font-bold text-green-700">Sistema Activo</span>
                    </div>
                </div>
            </div>

            <!-- Route Config -->
            <div>
                <div class="flex justify-between items-end mb-3 px-1">
                    <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Configurar Ruta de Hoy</h2>
                    <button onclick="app.toggleAllClients()" class="text-[10px] font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-full hover:bg-blue-100 active:scale-95 transition-transform">SELECCIONAR TODO</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 divide-y divide-slate-100 overflow-hidden" id="dashboard-client-list">
                    <!-- Client List Generated by JS -->
                </div>
            </div>

            <!-- History Link -->
            <button onclick="app.viewHistory()" class="w-full py-4 text-sm text-slate-500 font-medium hover:text-slate-800 flex items-center justify-center gap-2 border border-dashed border-slate-300 rounded-xl bg-slate-50/50">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Ver Historial de Rutas
            </button>
        </div>

        <!-- ACTIVE ROUTE VIEW -->
        <div id="view-route" class="hidden min-h-full bg-slate-100 animate-fade-in">
            <!-- Sticky Progress Header -->
            <div class="bg-white/95 backdrop-blur border-b border-slate-200 sticky top-0 z-20 px-4 py-3 shadow-sm">
                <div class="flex justify-between text-[10px] font-bold text-slate-500 mb-2 uppercase tracking-wider">
                    <span id="progress-text">Progreso: 0%</span>
                    <span id="stops-left-text">0 pendientes</span>
                </div>
                <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                    <div id="progress-bar" class="bg-blue-600 h-1.5 rounded-full transition-all duration-500 w-0"></div>
                </div>
            </div>

            <!-- Timeline -->
            <div class="p-4 pb-32">
                <div class="relative pl-4 border-l-2 border-slate-300 space-y-6" id="route-timeline">
                    <!-- Timeline Items Generated by JS -->
                </div>
            </div>
        </div>

        <!-- HISTORY VIEW -->
        <div id="view-history" class="hidden p-4 space-y-6 animate-fade-in pb-32">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-lg font-bold text-slate-800">Historial</h2>
                <button onclick="app.showDashboard()" class="text-sm text-blue-600 font-bold active:scale-95 transition-transform">Volver</button>
            </div>
            <div id="history-list" class="space-y-4">
                <!-- History Items Generated by JS -->
            </div>
        </div>
        
    </main>

    <!-- KEYPAD DRAWER (Bottom Sheet) -->
    <div id="keypad-overlay" class="fixed inset-0 bg-black/20 z-40 hidden transition-opacity" onclick="app.closeKeypad()"></div>
    <div id="keypad-drawer" class="fixed bottom-0 left-0 right-0 bg-white z-50 rounded-t-2xl shadow-2xl safe-pb border-t border-slate-200">
        <!-- Keypad Header -->
        <div class="flex justify-between items-center px-4 py-3 border-b border-slate-100 bg-slate-50 rounded-t-2xl">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider" id="keypad-label">Cantidad</span>
            <button onclick="app.closeKeypad()" class="text-blue-600 font-bold text-sm px-2 py-1">LISTO</button>
        </div>
        
        <!-- Keypad Grid -->
        <div class="p-2 grid grid-cols-4 gap-2 h-64">
            <!-- Shortcuts (Column 1) -->
            <button class="keypad-btn keypad-shortcut" onclick="app.keypadAdd(5)">+5</button>
            <button class="keypad-btn keypad-shortcut" onclick="app.keypadAdd(10)">+10</button>
            <button class="keypad-btn keypad-shortcut" onclick="app.keypadAdd(20)">+20</button>
            <button class="keypad-btn keypad-shortcut bg-red-50 text-red-500 border-red-100" onclick="app.keypadClear()">C</button>

            <!-- Numbers (Columns 2-4) -->
            <div class="col-span-3 grid grid-cols-3 gap-2 h-full">
                <button class="keypad-btn" onclick="app.keypadTap(1)">1</button>
                <button class="keypad-btn" onclick="app.keypadTap(2)">2</button>
                <button class="keypad-btn" onclick="app.keypadTap(3)">3</button>
                <button class="keypad-btn" onclick="app.keypadTap(4)">4</button>
                <button class="keypad-btn" onclick="app.keypadTap(5)">5</button>
                <button class="keypad-btn" onclick="app.keypadTap(6)">6</button>
                <button class="keypad-btn" onclick="app.keypadTap(7)">7</button>
                <button class="keypad-btn" onclick="app.keypadTap(8)">8</button>
                <button class="keypad-btn" onclick="app.keypadTap(9)">9</button>
                <button class="keypad-btn bg-slate-100 text-slate-400 text-lg" onclick="app.keypadBackspace()">⌫</button>
                <button class="keypad-btn" onclick="app.keypadTap(0)">0</button>
                <button class="keypad-btn keypad-action" onclick="app.closeKeypad()">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- FLOATING ACTION BAR -->
    <div id="fab-container" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur shadow-[0_-4px_20px_-5px_rgba(0,0,0,0.1)] border-t border-slate-200 p-4 safe-pb z-30 transition-transform duration-300">
        <!-- Dashboard Actions -->
        <div id="fab-dashboard" class="w-full">
            <button onclick="app.startRoute()" class="w-full bg-blue-600 active:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-blue-200 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm uppercase tracking-wide">
                <span>Iniciar Operación</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>
            </button>
        </div>

        <!-- Route Actions -->
        <div id="fab-route" class="hidden w-full flex gap-3">
             <button onclick="app.cancelRoute()" class="flex-1 bg-slate-100 text-slate-500 font-bold py-3.5 px-4 rounded-xl border border-slate-200 text-xs uppercase active:bg-slate-200 transition-colors">
                Cancelar
            </button>
            <button onclick="app.finishRoute()" id="btn-finish-route" class="flex-[2] bg-slate-800 text-slate-400 font-bold py-3.5 px-6 rounded-xl shadow-lg cursor-not-allowed text-xs uppercase flex items-center justify-center gap-2 transition-all" disabled>
                <span>Finalizar Ruta</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </button>
        </div>

        <!-- History Actions -->
        <div id="fab-history" class="hidden w-full">
            <button onclick="app.generateWeeklyReport()" class="w-full bg-green-600 active:bg-green-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-green-200 active:scale-[0.98] transition-transform flex items-center justify-center gap-2 text-sm uppercase tracking-wide">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.463 1.065 2.876 1.213 3.074.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                <span>Generar Manifiesto</span>
            </button>
        </div>
    </div>

    <!-- CONFIG OVERLAY -->
    <div id="view-config" class="hidden absolute inset-0 bg-white z-50 overflow-y-auto animate-fade-in">
        <div class="bg-slate-900 text-white px-4 py-4 flex justify-between items-center sticky top-0 z-10 safe-pt">
            <h2 class="font-bold text-lg">Configuración</h2>
            <button onclick="app.toggleConfig()" class="text-slate-300 hover:text-white px-2">Cerrar</button>
        </div>
        
        <div class="p-4 space-y-8 pb-10">
            <!-- Clients Config -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-slate-800">Cafeterías y Catálogo</h3>
                    <button onclick="app.addClientPrompt()" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold active:bg-blue-200">+ AGREGAR</button>
                </div>
                <ul id="config-client-list" class="bg-slate-50 rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden"></ul>
            </div>

            <!-- Products Config -->
            <div>
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-slate-800">Catálogo Maestro de Productos</h3>
                    <button onclick="app.addProductPrompt()" class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold active:bg-blue-200">+ AGREGAR</button>
                </div>
                <ul id="config-product-list" class="bg-slate-50 rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden"></ul>
            </div>
            
            <div class="pt-4 border-t border-slate-100">
                <button onclick="app.resetAllData()" class="text-red-500 text-xs font-bold uppercase tracking-wider w-full py-4 border border-red-100 bg-red-50 rounded-xl active:bg-red-100 transition-colors">
                    Restablecer Base de Datos
                </button>
            </div>
        </div>
    </div>

    <!-- LOGIC -->
    <script src="script.js"></script>
</body>
</html>
